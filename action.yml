# Checks an MCP policy file: validates it, runs its policy tests and checks
# recorded agent sessions against it. Builds the checker from source on first
# use, so the action needs no published package.
name: MCP policy check
description: Validate an MCP policy, run its policy tests and check recorded sessions against it.

inputs:
  policy:
    description: Path to the policy file.
    required: true
  sessions:
    description: >-
      Recorded session files to check against the policy. Paths or globs, separated by whitespace or newlines. Bash expands globs (`*`, `?`, and `**` which is recursive on bash 4 and later); there is no brace expansion. A path containing a space cannot be written literally: use `?` in its place.
    required: false
    default: ''
  tests:
    description: >-
      Policy test files to run. Paths or globs, separated by whitespace or newlines. Bash expands globs (`*`, `?`, and `**` which is recursive on bash 4 and later); there is no brace expansion. A path containing a space cannot be written literally: use `?` in its place.
    required: false
    default: ''
  config:
    description: Path to a proxy config file to validate along with the policy.
    required: false
    default: ''
  identity:
    description: Identity to check sessions as, when the sessions do not name one.
    required: false
    default: ''
  node-version:
    description: Node.js version used to build and run the checker.
    required: false
    default: '22'

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        # The consumer's lockfile and cache are not this action's to manage.
        package-manager-cache: false

    - name: Build the checker
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -f "$GITHUB_ACTION_PATH/dist/cli.js" ]; then
          cd "$GITHUB_ACTION_PATH"
          # --include=dev: the compiler is a dev dependency, and a consumer may
          # run with NODE_ENV=production.
          npm ci --ignore-scripts --include=dev
          npm run build
        fi

    - name: Validate the policy
      shell: bash
      env:
        POLICY: ${{ inputs.policy }}
        CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        args=(--policy "$POLICY")
        # The default keeps set -u from failing when the runner leaves an empty input unset.
        if [ -n "${CONFIG:-}" ]; then
          args+=(--config "$CONFIG")
        fi
        node "$GITHUB_ACTION_PATH/dist/cli.js" validate "${args[@]}"

    - name: Run policy tests
      if: inputs.tests != ''
      shell: bash
      env:
        POLICY: ${{ inputs.policy }}
        TESTS: ${{ inputs.tests }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        shopt -s globstar 2>/dev/null || true
        # -d '' reads all lines, not just the first; it returns 1 at end of input.
        read -r -d '' -a patterns <<< "$TESTS" || true
        if [ "${#patterns[@]}" -eq 0 ]; then
          echo "mcp-policy-check: input 'tests' is empty" >&2
          exit 2
        fi
        files=()
        for pattern in "${patterns[@]}"; do
          # Unquoted on purpose: the shell expands the glob. Splitting is
          # already done, so the pattern holds no whitespace.
          matches=($pattern)
          if [ "${#matches[@]}" -eq 0 ]; then
            echo "mcp-policy-check: input 'tests' matched no files: $pattern" >&2
            exit 2
          fi
          files+=("${matches[@]}")
        done
        node "$GITHUB_ACTION_PATH/dist/cli.js" test --policy "$POLICY" -- "${files[@]}"

    - name: Check recorded sessions
      if: inputs.sessions != ''
      shell: bash
      env:
        POLICY: ${{ inputs.policy }}
        SESSIONS: ${{ inputs.sessions }}
        IDENTITY: ${{ inputs.identity }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        shopt -s globstar 2>/dev/null || true
        # -d '' reads all lines, not just the first; it returns 1 at end of input.
        read -r -d '' -a patterns <<< "$SESSIONS" || true
        if [ "${#patterns[@]}" -eq 0 ]; then
          echo "mcp-policy-check: input 'sessions' is empty" >&2
          exit 2
        fi
        files=()
        for pattern in "${patterns[@]}"; do
          # Unquoted on purpose: the shell expands the glob. Splitting is
          # already done, so the pattern holds no whitespace.
          matches=($pattern)
          if [ "${#matches[@]}" -eq 0 ]; then
            echo "mcp-policy-check: input 'sessions' matched no files: $pattern" >&2
            exit 2
          fi
          files+=("${matches[@]}")
        done
        args=(--policy "$POLICY")
        if [ -n "${IDENTITY:-}" ]; then
          args+=(--identity "$IDENTITY")
        fi
        node "$GITHUB_ACTION_PATH/dist/cli.js" check "${args[@]}" -- "${files[@]}"
