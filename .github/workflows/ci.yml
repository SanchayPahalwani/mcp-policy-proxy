name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - shell: bash
        run: |
          set -euo pipefail
          npm ci

      - shell: bash
        run: |
          set -euo pipefail
          npm run format:check

      - shell: bash
        run: |
          set -euo pipefail
          npm run typecheck

      - shell: bash
        run: |
          set -euo pipefail
          npm test

      - shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: Check the example policy
        uses: ./
        with:
          policy: examples/policy.yaml
          tests: examples/policy.test.yaml
          sessions: examples/sessions/ok.jsonl

      # The checker must reject this session. Exit 2 would mean the file could
      # not be read, which is not what this step asserts.
      - name: Expect violations in the bad session
        shell: bash
        run: |
          set -euo pipefail
          status=0
          output=$(node dist/cli.js check --policy examples/policy.yaml --format text examples/sessions/violation.jsonl 2>&1) || status=$?
          echo "$output"
          if [ "$status" -ne 1 ]; then
            echo "expected exit 1 (violations found), got $status" >&2
            exit 1
          fi
          case "$output" in
            *"3 violation(s)"*) ;;
            *)
              echo "expected the report to say 3 violation(s)" >&2
              exit 1
              ;;
          esac

# eval replay step is added here by a later task
