# Example proxy config: serves the docs, web and mail mocks over stdio to agents on 127.0.0.1:8787.
# Start it with: WRITER_TOKEN=... RELEASE_MANAGER_TOKEN=... npm run cli -- serve --config examples/proxy.config.yaml
# Relative paths are read from this file's directory.

# Where agents connect. transport: http | stdio. Agents name their session in session_header.
# host must be a loopback name unless allow_non_loopback: true is set; then put TLS in front.
listen:
  { transport: http, host: 127.0.0.1, port: 8787, path: /mcp, session_header: x-agent-session }

# Who may connect. Each token comes from an environment variable, or give its token_sha256.
identities:
  - { name: writer, token_env: WRITER_TOKEN }
  - { name: release-manager, token_env: RELEASE_MANAGER_TOKEN }

# Over stdio there is no token, so the identity is fixed here.
# stdio_identity: writer            # required when listen.transport is stdio

# The MCP servers behind the proxy. Their tools are listed to agents as <name>__<tool>.
# A stdio child gets only a minimal environment; pass_env names proxy variables to hand it.
upstreams:
  docs: { transport: stdio, command: npx, args: [tsx, ../eval/servers/stdio.ts, docs] }
  web: { transport: stdio, command: npx, args: [tsx, ../eval/servers/stdio.ts, web] }
  mail: { transport: stdio, command: npx, args: [tsx, ../eval/servers/stdio.ts, mail] }
  # search: { transport: stdio, command: search-mcp, pass_env: [SEARCH_API_KEY] }
  # other: { transport: http, url: http://127.0.0.1:9001/mcp, headers_env: { Authorization: OTHER_UPSTREAM_AUTH } }

# The rules every call is checked against.
policy: ./policy.yaml

# One JSON line per decision, outcome and listing.
audit: { path: ./audit.jsonl }

# Who answers require_approval rules: cli | webhook | deny. webhook takes { url, secret_env };
# its url must be https:, or http: on 127.0.0.1, localhost or ::1.
# 55 seconds, so the answer arrives before the agent's MCP client gives up at 60.
approval: { type: cli, timeout_seconds: 55 }
